name: Android unit tests and lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          sdkmanager_path="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            echo "::error::Android sdkmanager was not found at $sdkmanager_path"
            exit 1
          fi
          "$sdkmanager_path" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run unit tests and debug lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
