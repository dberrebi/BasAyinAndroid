name: Upload Bas Ayin to Play testing

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play testing track
        type: choice
        options: [internal, alpha]
        default: internal
      status:
        description: Draft or complete the testing release
        type: choice
        options: [draft, completed]
        default: draft

permissions:
  contents: read

concurrency:
  group: bas-ayin-play-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check that signing and publishing are configured
        env:
          KEYSTORE: ${{ secrets.BASAYIN_UPLOAD_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.BASAYIN_UPLOAD_PASSWORD }}
          PLAY_CREDENTIAL: ${{ secrets.BASAYIN_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$KEYSTORE" || -z "$PASSWORD" || -z "$PLAY_CREDENTIAL" ]]; then
            echo '::error::Configure the Bas Ayin Play secrets before running this workflow. See play/RELEASING.md.'
            exit 1
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and sign the app bundle
        env:
          KEYSTORE: ${{ secrets.BASAYIN_UPLOAD_KEYSTORE_BASE64 }}
          BASAYIN_UPLOAD_KEYSTORE: ${{ runner.temp }}/bas-ayin-upload.p12
          BASAYIN_UPLOAD_PASSWORD: ${{ secrets.BASAYIN_UPLOAD_PASSWORD }}
          BASAYIN_UPLOAD_KEY_PASSWORD: ${{ secrets.BASAYIN_UPLOAD_KEY_PASSWORD || secrets.BASAYIN_UPLOAD_PASSWORD }}
          BASAYIN_UPLOAD_ALIAS: ${{ vars.BASAYIN_UPLOAD_ALIAS || 'upload' }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$BASAYIN_UPLOAD_KEYSTORE"
          unset KEYSTORE
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:bundleRelease \
            -Pbasayin.versionCode="$((100 + GITHUB_RUN_NUMBER))"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - name: Upload the testing release
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.BASAYIN_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.basayin.android
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.track }}
          status: ${{ inputs.status }}
          whatsNewDirectory: play/whatsnew
